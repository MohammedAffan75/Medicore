version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: medicore_db
    environment:
      POSTGRES_USER: medicore_user
      POSTGRES_PASSWORD: medicore_password
      POSTGRES_DB: medicore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
